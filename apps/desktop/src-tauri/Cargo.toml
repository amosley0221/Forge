[package]
name = "forge"
version = "0.4.0"
description = "Forge — AI 3D game asset studio"
authors = ["Dustline"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# keyring 3 ships no credential store by default — without a platform feature
# it falls back to an in-memory mock, which would silently drop the user's
# provider keys. Pick the native store per platform.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
